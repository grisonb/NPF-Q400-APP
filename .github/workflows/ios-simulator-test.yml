# NPF-Q400 APP — essai dans le simulateur iPad (aucun compte Apple, aucune signature, aucun secret).
# Fabrique l'app pour le simulateur, la lance en paysage puis en portrait, prend des
# captures d'écran et relève les erreurs JS de la page. Tout est gardé en artefact.
#
# Lancement : à la main (onglet Actions), ou par un push sur main qui CHANGE la version
# de l'app (champ "version" de package.json). Un push sans changement de version (journal,
# documentation…) ne lance pas l'essai (≈ 15 à 25 min de Mac).
name: NPF-Q400 APP - essai simulateur iPad

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Numéro de commit COMPLET (40 caractères) ou branche du code à essayer (vide = ce commit)"
        required: false
        default: ""
      label:
        description: "Étiquette des captures (ex. 0.1) ; vide = version de package.json"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-sim-${{ github.ref }}-${{ inputs.source_ref || 'head' }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Récupérer le code (avec l'historique du push)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: La version de l'app a-t-elle changé ?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Lancement à la main : essai simulateur."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          NOW=$(node -p "require('./package.json').version")
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Commit précédent inconnu : essai simulateur par prudence (version $NOW)."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OLD=$(git show "$BEFORE:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch(e){console.log('')}})")
          echo "Version avant le push : ${OLD:-inconnue} ; après : $NOW"
          if [ "$OLD" != "$NOW" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Version inchangée : pas d'essai simulateur."; fi

  simulator-test:
    needs: version-check
    if: needs.version-check.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Récupérer la recette d'essai (ce commit)
        uses: actions/checkout@v7
        with:
          path: recette

      - name: Récupérer le code de l'app à essayer
        uses: actions/checkout@v7
        with:
          path: app
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Étiquette
        id: label
        run: |
          L="${{ inputs.label }}"
          if [ -z "$L" ]; then L=$(node -p "require('./app/package.json').version.replace(/\.0$/, '')"); fi
          echo "label=$L" >> "$GITHUB_OUTPUT"
          echo "Étiquette : $L"

      - name: Essai simulateur (paysage et portrait)
        run: bash recette/scripts/sim-test.sh app "resultats/NPF-Q400-APP-${{ steps.label.outputs.label }}-simulateur" "${{ steps.label.outputs.label }}"

      - name: Garder captures, journaux et bilan (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NPF-Q400-APP-${{ steps.label.outputs.label }}-simulateur
          path: resultats/
          retention-days: 30
          if-no-files-found: warn
